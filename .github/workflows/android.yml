name: Android

on:
  push:
    branches:
      - merge-desktop
      - 'feature-*'
  pull_request:
    branches:
      - merge-desktop
      - 'feature-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect submodules
        run: |
          git submodule status
          ls third-party/nanopb | head
          ls third-party/jerasure | head

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: android/app/.cxx/**/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'android/app/CMakeLists.txt', 'android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Decode Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -o pipefail
          : > build.log
          for attempt in 1 2 3; do
            echo "assembleDebug attempt ${attempt}/3"
            if ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee -a build.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying in 10 seconds"
              sleep 10
            fi
          done
          exit 1

      - name: Show CMake errors
        if: failure()
        working-directory: android
        run: |
          grep -n -A12 'CMake Error' build.log | head -80 || true
          if [ -d app/.cxx ]; then
            grep -rn -A12 'CMake Error' app/.cxx --include='*.log' | head -80 || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
